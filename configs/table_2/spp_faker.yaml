# SPP (Similarity of Partial Parameters) - Faker Attack
experiment_name: "spp_faker"
random_seed: 42
dataset:
  type: "mnist"
  data_dir: "./data"
  num_classes: 10
  partition_type: "non_iid"
  alpha: 5                    # c=5 classes per client
model:
  type: "lenet"
  num_classes: 10
federated_learning:
  num_rounds: 30
  num_clients: 100
  client_participation_rate: 1.0     # Changed: All clients participate
  learning_rate: 0.01
  local_epochs: 2
  batch_size: 32
server:
  data_size: 100                     # SPP requires clean dataset for reference model
  aggregation: "fedavg"              # SPP uses FedAvg after filtering
attack:
  type: "faker"
  num_malicious_clients: 20
  params:
    target_defense: "fltrust"        # SPP uses cosine similarity like FLTrust
    num_groups: 10                   # T=10 for richer optimization space
    cooperative: false               # Non-cooperative for SPP
defense:
  type: "spp"
  params:
    selection_ratio: 0.5             # Select 50% of parameters randomly
    cosine_threshold: 0.9            # High threshold to detect Faker (benign ~0.99, Faker ~0.7-0.8)