# SPP (Similarity of Partial Parameters) - No Attack
experiment_name: "spp_none"
random_seed: 42
dataset:
  type: "mnist"
  data_dir: "./data"
  num_classes: 10
  partition_type: "non_iid"
  alpha: 5                    # c=5 classes per client
model:
  type: "lenet"
  num_classes: 10
federated_learning:
  num_rounds: 30
  num_clients: 100
  client_participation_rate: 1.0     # Changed: All clients participate
  learning_rate: 0.01
  local_epochs: 2
  batch_size: 32
server:
  data_size: 500
attack:
  type: "none"
  num_malicious_clients: 0
defense:
  type: "spp"
  params:
    selection_ratio: 0.5             # Select 50% of parameters randomly
    cosine_threshold: 0.9            # High threshold (benign models ~0.99)