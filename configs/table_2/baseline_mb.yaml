# Baseline (FedAvg) - MB Attack
experiment_name: "baseline_mb"
random_seed: 42
dataset:
  type: "mnist"
  data_dir: "./data"
  num_classes: 10
  partition_type: "non_iid"
  alpha: 5                    # c=5 for non-IID distribution
model:
  type: "lenet"
  num_classes: 10
federated_learning:
  num_rounds: 30
  num_clients: 100
  client_participation_rate: 1.0  # Changed: All clients participate
  learning_rate: 0.01
  optimizer: "adam"                # Added: Paper uses Adam optimizer
  local_epochs: 2
  batch_size: 32
server:
  aggregation: "fedavg"            # Added: Explicitly use FedAvg
  data_size: 0                     # Changed: No clean dataset needed
attack:
  type: "mb"
  num_malicious_clients: 20
  params:
    threshold: 100000              # Changed: Paper uses threshold = 10^5
    max_iterations: 200            # MB uses iterative search method
defense:
  type: "none"
